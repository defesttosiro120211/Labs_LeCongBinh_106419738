<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Lab 03 - CWA Help Desk Appointment Form">
    <meta name="keywords" content="HTML, Form, tags">
    <meta name="author" content="Le Cong Binh">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <a href="http://www.swin.edu.au">
        <img src="images/logo.png" alt="Swinburne University of Technology Logo">
    </a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>
    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
        <fieldset>
            <legend>Student details</legend>
            <p>
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required="required" pattern="\d{7,10}">
            </p>
            <p>
                <label for="given_name">Given Name</label>
                <input type="text" id="given_name" name="given_name" maxlength="15" required="required" pattern="[A-Za-z ]+">
                <label for="family_name">Family Name</label>
                <input type="text" id="family_name" name="family_name" maxlength="15" required="required" pattern="[A-Za-z ]+">
            </p>
        </fieldset>
        <fieldset>
            <legend>Your unit</legend>
            <p>
                <input type="radio" id="unit_cos10011" name="unit" value="COS10011">
                <label for="unit_cos10011">COS10011</label>
                <input type="radio" id="unit_cos60004" name="unit" value="COS60004">
                <label for="unit_cos60004">COS60004</label>
                <input type="radio" id="unit_cos60007" name="unit" value="COS60007" required="required">
                <label for="unit_cos60007">COS60007</label>
            </p>
            <p>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" required="required">
                    <option value="">Please Select</option>
                    <option value="wilson">Wilson</option>
                    <option value="anhngoc">Anh Ngoc</option>
                    <option value="jevi">Jevi</option>
                    <option value="niko">Niko</option>
                    <option value="zywoo">Zywoo</option>
                </select>
            </p>
        </fieldset>
        <fieldset>
            <legend>Issue</legend>
            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">
                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="issue[]" value="css">
                <label for="javascript">JavaScript</label>
                <input type="checkbox" id="javascript" name="issue[]" value="javascript">
                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="issue[]" value="php">
                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="issue[]" value="mysql">
            </p>
            <p>
                <label for="issue_desc">Description of Issue</label><br>
                <textarea id="issue_desc" name="issue_desc" rows="5" cols="67" placeholder="Write description of your problem here..."></textarea>
            </p>
        </fieldset>
        <fieldset>
            <legend>Preferred Date / Time</legend>
            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            </p>
            <p>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Book">
            <input type="reset" value="Reset form">
        </p>
    </form>
</body>
</html>
